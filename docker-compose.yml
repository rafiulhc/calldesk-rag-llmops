services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: llmops
      POSTGRES_PASSWORD: llmops
      POSTGRES_DB: llmops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmops -d llmops"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: .env                      # OPENAI_API_KEY, APP_API_KEY, ... (local only; AWS uses Secrets Manager)
    environment:
      # inside Docker the database is reached by its service name, not localhost
      DATABASE_URL: postgresql://llmops:llmops@db:5432/llmops
      LANGSMITH_TRACING: "false"        # turn on deliberately when you want traces from the container
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
