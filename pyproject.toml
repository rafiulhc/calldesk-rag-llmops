[project]
name = "llmops-starter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RAFIUL HASAN", email = "rafiulhasan86@gmail.com" }
]
requires-python = ">=3.12"
# Only what the production API needs: /ask (RAG) and /agent (LangGraph agent).
dependencies = [
    "fastapi>=0.143.0",
    "langchain-core>=1.6.9",               # /agent
    "langchain-openai>=1.7.0",             # /agent
    "langgraph>=1.2.14",                   # /agent
    "langgraph-checkpoint-postgres>=3.1.2", # /agent conversation memory
    "numpy>=2.5.3",
    "openai>=3.27.0",
    "pgvector>=0.3,<0.4",          # <0.4 because langchain-postgres (lessons group) requires it
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
llmops-starter = "llmops_starter:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
# LangChain / LangGraph / MCP lessons: installed locally, left out of the Docker image.
lessons = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "mcp>=2.3.0",
    "pypdf>=6.20.0",
]

[tool.uv]
default-groups = ["dev", "lessons"]   # `uv sync` / `uv run` locally still installs everything

[tool.pytest.ini_options]
pythonpath = ["rag"]
testpaths = ["tests"]
