[project]
name = "llmops-starter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RAFIUL HASAN", email = "rafiulhasan86@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.0",
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-openai>=1.7.0",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "numpy>=2.5.3",
    "openai>=3.27.0",
    "pgvector>=0.3,<0.4",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
llmops-starter = "llmops_starter:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["rag"]
testpaths = ["tests"]
